<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spider-Man: Web of Shadows | New Avalon</title>
<style>
:root{--cyan:#63f5ff;--red:#ff3c54;--glass:rgba(5,13,29,.78);--line:rgba(130,235,255,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a16;color:#fff;font-family:Tahoma,Arial,sans-serif;touch-action:none}
canvas{display:block;position:absolute;inset:0}
#boot{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#193c5b,#050814 70%);z-index:20;text-align:center;padding:24px}
.panel{width:min(92vw,480px);border:1px solid var(--line);background:linear-gradient(145deg,rgba(9,27,48,.96),rgba(7,10,25,.95));border-radius:22px;padding:25px 22px;box-shadow:0 0 45px #00cfff20}
.logo{font-size:clamp(25px,7vw,42px);font-weight:900;letter-spacing:1px;line-height:1.1;text-shadow:0 0 22px #20d8ff66}.logo span{color:var(--red)}
.sub{color:#a8d6e8;font-size:13px;line-height:1.9;margin:13px 0 20px}
button{border:1px solid #8ef5ff88;background:linear-gradient(110deg,#087b9b,#174c80);color:white;border-radius:14px;padding:13px 18px;font: bold 15px Tahoma;box-shadow:0 5px 20px #00d9ff24}
button:active{transform:scale(.97)}.hint{font-size:11px;color:#92b4ca;margin-top:13px;line-height:1.8}
#hud{position:absolute;inset:0;pointer-events:none;display:none}
.top{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:12px;backdrop-filter:blur(8px);box-shadow:0 4px 16px #0004}
#healthbar{height:5px;width:100px;background:#492333;border-radius:8px;margin-top:6px;overflow:hidden}#healthfill{height:100%;width:100%;background:linear-gradient(90deg,#ff3150,#ff8492)}
#mission{max-width:50vw;text-align:center;color:#c7f9ff}#score{text-align:left;min-width:70px}
#toast{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:#06192ae8;border:1px solid #5ff5ff88;border-radius:12px;padding:10px 15px;font-size:13px;opacity:0;transition:opacity .25s;white-space:nowrap}
#controls{position:absolute;inset:0;pointer-events:none}
#stickArea{position:absolute;left:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:#c3efff12;border:1px solid #9cefff55;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:48px;height:48px;left:37px;top:37px;border-radius:50%;background:#72edff55;border:2px solid #b8f9ff;box-shadow:0 0 18px #00cfff44}
#lookArea{position:absolute;right:0;top:22%;width:43%;height:48%;pointer-events:auto;touch-action:none}
#buttons{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,64px);gap:9px;pointer-events:auto}
.ctrl{width:64px;height:58px;padding:3px;font-size:11px;border-radius:18px;background:#071a2dcc;border-color:#8eefff88;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
.ctrl b{font-size:21px;line-height:1}.ctrl.red{border-color:#ff7085aa;background:#4b1026cc}
#pause{position:absolute;top:calc(65px + env(safe-area-inset-top));right:12px;pointer-events:auto;width:40px;height:38px;padding:0;border-radius:10px;background:#071a2dcc}
#centerMsg{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-weight:bold;text-shadow:0 2px 10px #000;text-align:center;max-width:90vw}
#end{position:absolute;inset:0;z-index:15;display:none;place-items:center;background:#020611c9;padding:20px}
@media(min-width:700px){#stickArea{width:145px;height:145px}#stick{left:45px;top:45px}#buttons{grid-template-columns:repeat(3,70px)}.ctrl{width:70px;height:62px}#lookArea{width:48%}}
</style>
</head>
<body>
<div id="boot">
 <div class="panel">
  <div style="font-size:32px;margin-bottom:10px">✦</div>
  <div class="logo">SPIDER-MAN<br><span>WEB OF SHADOWS</span></div>
  <div class="sub">نیو آوالون، شهر آسمان‌خراش‌ها<br>در شهر بچرخ، از میان برج‌ها تاب بخور و جلوی خلافکارها را بگیر.</div>
  <button id="start">ورود به شهر ←</button>
  <div class="hint">نمونهٔ قابل‌بازی سه‌بعدی · کنترل لمسی · برای بارگیری موتور گرافیکی اینترنت لازم است</div>
 </div>
</div>
<div id="hud">
 <div class="top">
  <div class="pill"><div>♥ <span id="hp">100</span></div><div id="healthbar"><div id="healthfill"></div></div></div>
  <div class="pill" id="mission">ماموریت فعال<br><b id="missionText">به نقطهٔ درخشان برس</b></div>
  <div class="pill" id="score">✦ <span id="points">0</span><br><small>امتیاز</small></div>
 </div>
 <button id="pause">Ⅱ</button>
 <div id="toast"></div>
 <div id="controls">
  <div id="stickArea"><div id="stick"></div></div>
  <div id="lookArea"></div>
  <div id="buttons">
   <button class="ctrl" id="swing"><b>🕸</b><span>تاب‌خوردن</span></button>
   <button class="ctrl" id="jump"><b>⬆</b><span>پرش</span></button>
   <button class="ctrl red" id="attack"><b>✊</b><span>ضربه</span></button>
   <button class="ctrl" id="web"><b>◎</b><span>تاراندازی</span></button>
   <button class="ctrl" id="dodge"><b>➤</b><span>جا‌خالی</span></button>
  </div>
 </div>
 <div id="centerMsg"></div>
</div>
<div id="end"><div class="panel"><div class="logo">ماموریت کامل شد!</div><p id="endText" class="sub"></p><button id="again">شروع دوباره</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const boot=$('boot'),hud=$('hud'),toastEl=$('toast');
let scene,camera,renderer,clock,player,webLine,webTarget=null,webTimer=0;
let running=false,paused=false,score=0,hp=100,stage=0,toastTimer=0;
let buildings=[],enemies=[],collectibles=[],particles=[],keys={x:0,y:0},look={x:0,y:0},yaw=0,pitch=.15,vel=new THREE.Vector3(),onGround=true,swinging=false,attackCooldown=0,webCooldown=0,invuln=0;
const worldSize=250;
function toast(s){toastEl.textContent=s;toastEl.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.style.opacity=0,1900)}
function mat(color,rough=.75,emissive=0){return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:.08,emissive:color,emissiveIntensity:emissive})}
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function makeCity(){
 scene.background=new THREE.Color(0x081323);scene.fog=new THREE.FogExp2(0x081323,.0034);
 const hemi=new THREE.HemisphereLight(0x8acfff,0x172033,2.05);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xb8e4ff,2.1);sun.position.set(-50,100,35);scene.add(sun);
 const ground=box(260,2,260,mat(0x182331),0,-1.2,0);
 const roadMat=mat(0x111a26),sideMat=mat(0x34414d),lineMat=mat(0x6b8291,.4,.15);
 for(let z=-120;z<=120;z+=40){box(13,.12,260,roadMat,0,-.12,z);box(.18,.04,260,lineMat,-5.5,-.04,z);box(.18,.04,260,lineMat,5.5,-.04,z)}
 for(let x=-120;x<=120;x+=40){box(260,.12,13,roadMat,x,-.12,0);box(260,.04,.18,lineMat,x,-.04,-5.5);box(260,.04,.18,lineMat,x,-.04,5.5)}
 const colors=[0x293b50,0x33485b,0x243449,0x45566b,0x253b4c,0x39485a];
 for(let x=-110;x<=110;x+=20)for(let z=-110;z<=110;z+=20){
  if(Math.abs(x)<14||Math.abs(z)<14)continue;
  const w=9+Math.random()*5,d=9+Math.random()*5,h=12+Math.random()*47;
  const b=box(w,h,d,mat(colors[Math.floor(Math.random()*colors.length)]),x,h/2,z);buildings.push(b);
  // Lit windows on street-facing walls
  const winmat=new THREE.MeshBasicMaterial({color:Math.random()>.35?0x68cfff:0xffd18a});
  for(let yy=4;yy<h-2;yy+=4)for(let xx=-w/2+1.4;xx<w/2-1;xx+=2.2){
   if(Math.random()<.38)continue;
   const win=new THREE.Mesh(new THREE.BoxGeometry(.8,1.2,.08),winmat);win.position.set(x+xx,yy,z+d/2+.045);scene.add(win);
  }
 }
 // glowing mission marker
 const ring=new THREE.Mesh(new THREE.TorusGeometry(2.2,.18,8,32),new THREE.MeshBasicMaterial({color:0x50f7ff}));
 ring.rotation.x=Math.PI/2;ring.position.set(40,.25,-40);scene.add(ring);
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(.12,.9,13,12,1,true),new THREE.MeshBasicMaterial({color:0x26eaff,transparent:true,opacity:.22,side:THREE.DoubleSide}));beam.position.set(40,6.5,-40);scene.add(beam);
 window.marker={ring,beam};
 // skyline beacons
 for(let i=0;i<14;i++){let x=(Math.random()-.5)*220,z=(Math.random()-.5)*220;let light=new THREE.PointLight(0x16bfff,9,28);light.position.set(x,15+Math.random()*20,z);scene.add(light)}
}
function createHero(){
 const group=new THREE.Group();scene.add(group);
 const blue=mat(0x143b93,.4),red=mat(0xd92742,.38),dark=mat(0x091321,.6),white=mat(0xeaf8ff,.3);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.58,.9,4,8),red);torso.position.y=1.65;group.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),red);head.position.y=2.65;group.add(head);
 const eyeMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,emissive:0x567cff,emissiveIntensity:.15});
 for(const side of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.105,10,8),eyeMat);eye.scale.set(.65,1.5,.45);eye.position.set(side*.16,2.69,.36);group.add(eye)}
 const belt=new THREE.Mesh(new THREE.BoxGeometry(.82,.18,.58),dark);belt.position.y=1.15;group.add(belt);
 for(const side of [-1,1]){
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.17,.7,3,7),blue);arm.position.set(side*.72,1.75,0);arm.rotation.z=side*-.2;group.add(arm);
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.21,.68,3,7),blue);leg.position.set(side*.28,.52,0);group.add(leg);
  const boot=new THREE.Mesh(new THREE.BoxGeometry(.36,.2,.48),dark);boot.position.set(side*.28,.13,.12);group.add(boot);
 }
 // spider emblem
 const emblem=new THREE.Mesh(new THREE.SphereGeometry(.16,8,8),white);emblem.scale.set(.7,1.2,.12);emblem.position.set(0,1.8,.58);group.add(emblem);
 player=group;player.position.set(0,0,4);
}
function createEnemy(x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.65,3,7),mat(0x6b2038));body.position.y=1.25;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.32,12,8),mat(0x202b3c));head.position.y=2.08;g.add(head);
 const eye=new THREE.Mesh(new THREE.BoxGeometry(.34,.07,.08),new THREE.MeshBasicMaterial({color:0xff334c}));eye.position.set(0,2.1,.29);g.add(eye);
 g.userData={hp:3,hit:0,attack:0,phase:Math.random()*6};enemies.push(g);
}
function createCollectible(x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,1.4,z);
 const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.7),new THREE.MeshStandardMaterial({color:0x61f7ff,emissive:0x00bde8,emissiveIntensity:1.2,metalness:.3,roughness:.2}));g.add(gem);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.95,.06,6,24),new THREE.MeshBasicMaterial({color:0xa3faff}));g.add(ring);
 collectibles.push(g);
}
function addParticles(pos,color=0x62f4ff,count=10){for(let i=0;i<count;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.07+Math.random()*.09,6,5),new THREE.MeshBasicMaterial({color,transparent:true}));m.position.copy(pos);scene.add(m);particles.push({m,v:new THREE.Vector3((Math.random()-.5)*7,Math.random()*6,(Math.random()-.5)*7),life:.6+Math.random()*.5})}}
function init(){
 try{
  if(!window.THREE)throw new Error('Three.js بارگیری نشد. اتصال اینترنت یا دسترسی به CDN را بررسی کن.');
  renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
  document.body.insertBefore(renderer.domElement,document.body.firstChild);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,500);clock=new THREE.Clock();
  makeCity();createHero();
  createEnemy(16,-3);createEnemy(-18,-24);createEnemy(28,-47);createEnemy(-40,36);
  createCollectible(8,-16);createCollectible(-28,-42);createCollectible(52,18);createCollectible(36,-34);createCollectible(-48,12);
  webLine=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]),new THREE.LineBasicMaterial({color:0xf0fcff}));scene.add(webLine);webLine.visible=false;
  window.addEventListener('resize',resize);setupControls();animate();
 }catch(e){showError(e)}
}
function showError(e){boot.innerHTML='<div class="panel"><div class="logo">خطای اجرا</div><p class="sub">'+String(e&&e.message||e)+'</p><p class="hint">اگر خطا مربوط به WebGL است، Chrome را به‌روز کن. اگر Three.js بارگیری نشده، اتصال اینترنت یا دسترسی به CDN را بررسی کن.</p><button onclick="location.reload()">تلاش دوباره</button></div>';console.error(e)}
function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5))}
function setupControls(){
 const area=$('stickArea'),knob=$('stick');let stickId=null,center={x:0,y:0};
 function stickStart(e){e.preventDefault();stickId=e.pointerId;center={x:e.clientX,y:e.clientY};area.setPointerCapture(stickId);stickMove(e)}
 function stickMove(e){if(e.pointerId!==stickId)return;let dx=e.clientX-center.x,dy=e.clientY-center.y,lim=39,len=Math.hypot(dx,dy);if(len>lim){dx=dx/len*lim;dy=dy/len*lim}knob.style.left=(37+dx)+'px';knob.style.top=(37+dy)+'px';keys.x=dx/lim;keys.y=-dy/lim}
 function stickEnd(e){if(e.pointerId!==stickId)return;stickId=null;keys.x=keys.y=0;knob.style.left='37px';knob.style.top='37px'}
 area.addEventListener('pointerdown',stickStart);area.addEventListener('pointermove',stickMove);area.addEventListener('pointerup',stickEnd);area.addEventListener('pointercancel',stickEnd);
 const lookArea=$('lookArea');let lookId=null,last={x:0,y:0};
 lookArea.addEventListener('pointerdown',e=>{lookId=e.pointerId;last={x:e.clientX,y:e.clientY};lookArea.setPointerCapture(lookId)});
 lookArea.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;yaw-=(e.clientX-last.x)*.006;pitch=Math.max(-.25,Math.min(.75,pitch+(e.clientY-last.y)*.003));last={x:e.clientX,y:e.clientY}});
 const endLook=e=>{if(e.pointerId===lookId)lookId=null};lookArea.addEventListener('pointerup',endLook);lookArea.addEventListener('pointercancel',endLook);
 const bind=(id,down,up=()=>{})=>{const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);down()});b.addEventListener('pointerup',e=>{e.preventDefault();up()});b.addEventListener('pointercancel',up)};
 bind('swing',()=>{swinging=true;webTimer=0;toast('تار وصل شد!')},()=>{swinging=false;webLine.visible=false;webTarget=null});
 bind('jump',jump);bind('attack',attack);bind('web',shootWeb);bind('dodge',dodge);
 $('pause').addEventListener('click',()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ';toast(paused?'بازی متوقف شد':'ادامه بده، قهرمان!')});
 $('start').addEventListener('click',()=>{boot.style.display='none';hud.style.display='block';running=true;toast('به نیو آوالون خوش آمدی!')});
 $('again').addEventListener('click',()=>location.reload());
}
function jump(){if(!running||paused)return;if(onGround){vel.y=10;onGround=false;addParticles(player.position.clone().add(new THREE.Vector3(0,.2,0)),0x70eaff,5)}else if(swinging){vel.y+=4}}
function shootWeb(){if(!running||paused||webCooldown>0)return;webCooldown=.65;const dir=new THREE.Vector3(-Math.sin(yaw),.12,-Math.cos(yaw));const origin=player.position.clone().add(new THREE.Vector3(0,2,0));webTarget=origin.clone().add(dir.multiplyScalar(34));webLine.geometry.dispose();webLine.geometry=new THREE.BufferGeometry().setFromPoints([origin,webTarget]);webLine.visible=true;webTimer=.22;addParticles(webTarget,0xf5ffff,5);toast('تاراندازی!')}
function attack(){if(!running||paused||attackCooldown>0)return;attackCooldown=.48;addParticles(player.position.clone().add(new THREE.Vector3(0,1.5,0)).add(new THREE.Vector3(-Math.sin(yaw)*1.6,0,-Math.cos(yaw)*1.6)),0xff4a68,7);let hit=false;for(const e of enemies){if(e.userData.hp<=0)continue;const d=e.position.distanceTo(player.position);if(d<4){e.userData.hp--;e.userData.hit=.25;hit=true;addParticles(e.position.clone().add(new THREE.Vector3(0,1.5,0)),0xff536c,10);if(e.userData.hp<=0){e.visible=false;score+=100;$('points').textContent=score;toast('خلافکار شکست خورد! +100')}}}if(!hit)toast('ضربه به هدف نرسید')}
function dodge(){if(!running||paused)return;const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));vel.add(f.multiplyScalar(8));invuln=.6;addParticles(player.position.clone().add(new THREE.Vector3(0,1,0)),0x5ceaff,4)}
function update(dt){
 if(!running||paused)return;
 attackCooldown=Math.max(0,attackCooldown-dt);webCooldown=Math.max(0,webCooldown-dt);invuln=Math.max(0,invuln-dt);
 if(webTimer>0){webTimer-=dt;if(webTimer<=0)webLine.visible=false}
 const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 const move=forward.clone().multiplyScalar(keys.y).add(right.multiplyScalar(keys.x));if(move.length()>1)move.normalize();
 const speed=swinging?18:8.3;
 vel.x+=move.x*speed*dt*3.5;vel.z+=move.z*speed*dt*3.5;
 const drag=Math.pow(swinging?.985:.82,dt*60);vel.x*=drag;vel.z*=drag;
 if(!onGround)vel.y-=19*dt;
 if(swinging){
  if(!webTarget){let best=null,bd=70;for(const b of buildings){let d=b.position.distanceTo(player.position);if(d<bd&&b.position.y>player.position.y+5){best=b;bd=d}}if(best)webTarget=new THREE.Vector3(best.position.x,best.position.y+best.geometry.parameters.height/2,best.position.z)}
  if(webTarget){const delta=webTarget.clone().sub(player.position);let dist=delta.length();let pull=delta.normalize().multiplyScalar(Math.min(20,dist*.48));vel.addScaledVector(pull,dt);const origin=player.position.clone().add(new THREE.Vector3(0,2,0));webLine.geometry.dispose();webLine.geometry=new THREE.BufferGeometry().setFromPoints([origin,webTarget]);webLine.visible=true;if(dist<5){webTarget=null;webLine.visible=false}}
 }else if(webTarget&&webTimer<=0){webTarget=null;webLine.visible=false}
 player.position.addScaledVector(vel,dt);
 if(player.position.y<=0){player.position.y=0;vel.y=0;onGround=true}else onGround=false;
 player.position.x=Math.max(-124,Math.min(124,player.position.x));player.position.z=Math.max(-124,Math.min(124,player.position.z));
 if(move.lengthSq()>.02){player.rotation.y=Math.atan2(-move.x,-move.z);player.rotation.z=THREE.MathUtils.clamp(-keys.x*.14,-.14,.14)}
 // Keep player above road/buildings when colliding with a building footprint.
 for(const b of buildings){const dx=player.position.x-b.position.x,dz=player.position.z-b.position.z;const w=b.geometry.parameters.width/2+.65,d=b.geometry.parameters.depth/2+.65;if(Math.abs(dx)<w&&Math.abs(dz)<d&&player.position.y<b.geometry.parameters.height+.1){if(Math.abs(dx/w)>Math.abs(dz/d))player.position.x=b.position.x+Math.sign(dx||1)*w;else player.position.z=b.position.z+Math.sign(dz||1)*d;vel.x*=.35;vel.z*=.35}}
 for(const c of collectibles){if(!c.visible)continue;c.rotation.y+=dt*1.7;c.position.y=1.35+Math.sin(performance.now()*.002+c.position.x)*.25;if(c.position.distanceTo(player.position)<2.6){c.visible=false;score+=50;$('points').textContent=score;addParticles(c.position,0x62f5ff,15);toast('نشان شهر پیدا شد! +50')}}
 for(const e of enemies){if(!e.visible)continue;const d=e.position.distanceTo(player.position);e.userData.phase+=dt*4;e.children[1].position.y=2.08+Math.sin(e.userData.phase)*.05;if(d<20){const v=player.position.clone().sub(e.position);v.y=0;if(d>2.3){v.normalize();e.position.addScaledVector(v,dt*2.3);e.rotation.y=Math.atan2(-v.x,-v.z)}if(d<2.4&&e.userData.attack<=0&&invuln<=0){e.userData.attack=1.15;hp=Math.max(0,hp-8);$('hp').textContent=hp;$('healthfill').style.width=hp+'%';toast('ضربه خوردی! مراقب باش');if(hp<=0)finish(false)}}e.userData.attack=Math.max(0,e.userData.attack-dt);if(e.userData.hit>0){e.userData.hit-=dt;e.position.y=.15}else e.position.y=0}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.v.y-=7*dt;p.m.position.addScaledVector(p.v,dt);p.m.material.opacity=Math.max(0,p.life);if(p.life<=0){scene.remove(p.m);p.m.geometry.dispose();p.m.material.dispose();particles.splice(i,1)}}
 const target=new THREE.Vector3(player.position.x+Math.sin(yaw+Math.PI)*10,player.position.y+4+pitch*6,player.position.z+Math.cos(yaw+Math.PI)*10);
 camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.5,player.position.z);
 if(window.marker){window.marker.ring.rotation.z+=dt*.8;window.marker.beam.material.opacity=.15+Math.sin(performance.now()*.004)*.08;if(player.position.distanceTo(new THREE.Vector3(40,0,-40))<5){stage++;if(stage>=1){score+=250;$('points').textContent=score;finish(true)}window.marker.ring.position.set(100,0,-95);window.marker.beam.position.set(100,6.5,-95);toast('نقطهٔ ماموریت پیدا شد! +250')}}
}
function finish(win){running=false;$('end').style.display='grid';$('endText').textContent=win?'تو به نقطهٔ ماموریت رسیدی و ۲۵۰ امتیاز گرفتی. این نسخه یک نمونهٔ اولیه است؛ داستان و مراحل کامل هنوز ساخته نشده‌اند.':'سلامتی‌ات تمام شد. دوباره امتحان کن، قهرمان!'}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock?clock.getDelta():.016,.04);if(scene&&camera&&renderer){update(dt);renderer.render(scene,camera)}}
init();
})();
</script>
